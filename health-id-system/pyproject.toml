[project]
name = "health-id-system"
version = "1.0.0"
description = "Исследовательский интегральный индекс здоровья для ПрМО"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
