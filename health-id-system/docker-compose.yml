services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: biometry_health
      POSTGRES_USER: bio_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bio_user -d biometry_health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
