kind = "web"
previewPath = "/"
title = "HEALTH_ID — исследовательская консоль"
description = "Русскоязычная исследовательская консоль для воспроизводимого расчёта HEALTH_ID, ручной проверки результатов, верификации и управления моделью."
version = "1.0.0"
id = "artifacts/health-id-console-ru"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24070

[services.development]
run = "pnpm --filter @workspace/health-id-console-ru run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/health-id-console-ru", "run", "build" ]
serve = "static"
publicDir = "artifacts/health-id-console-ru/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24070"
BASE_PATH = "/"
